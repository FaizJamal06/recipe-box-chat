# Loose ingredient groups for "broad" stats (PRD 4.5). family(canonical):
#   1. canonical listed in a family's `members`            -> that family
#   2. canonical ends with " <family>" (cherry tomato) or equals it, and is not in that family's `broad`
#                                                           -> that family
#   3. otherwise                                            -> the canonical itself
# `broad` members keep their own family; stats in broad mode add them (green onion counts as onion).
onion:
  members: [red onion, sweet onion, pearl onion, cipollini onion]
  broad: [green onion, onion powder, dried onion, shallot, leek, chives]
tomato:
  members: [plum tomato, cherry tomato, heirloom tomato, beefsteak tomato, canned tomatoes, diced tomatoes,
            crushed tomatoes, whole tomatoes, stewed tomatoes]
  broad: [sun-dried tomato, green tomato, tomatillo, tomato paste, tomato sauce, tomato puree]
garlic:
  members: []
  broad: [garlic powder, garlic salt, roasted garlic]
bell pepper:
  members: [red bell pepper, green bell pepper, yellow bell pepper, orange bell pepper, roasted red pepper]
  broad: []
