# Loose ingredient groups (PRD 4.5). Names are singularized on load. family(canonical) = the group of the
# LONGEST word-suffix of the canonical that is listed here:
#   family name or one of its `members`  -> that family          ('extra lean ground beef' -> beef)
#   one of its `broad` entries           -> that entry, its own group ('sliced green onion' -> green onion)
#   one of its `exclude` entries         -> the canonical itself  ('light sour cream' is not cream)
#   nothing                              -> the canonical itself
# strict F = lines whose family is F. broad F = strict F + lines whose family or canonical is in F's `broad`.
garlic:
  members: [garlic clove, clove garlic, cloves garlic, minced garlic, chopped garlic, fresh garlic, garlic bulb,
            bulb garlic, garlic head, head garlic, heads garlic, garlic paste, garlic puree, pureed garlic,
            roasted garlic]
  broad: [garlic powder, garlic salt, granulated garlic, dried garlic, garlic flake]
  exclude: [tomatoes garlic]
onion:
  members: [red onion, white onion, yellow onion, sweet onion, vidalia onion, spanish onion, maui onion, purple onion,
            pearl onion, cipollini onion, walla walla onion, caramelized onion]
  broad: [green onion, shallot, onion powder, onion salt, dried onion, onion flake, fried onion, french-fried onion]
  exclude: [pickled onion, pickled red onion]
tomato:
  members: [plum tomato, roma tomato, cherry tomato, grape tomato, heirloom tomato, beefsteak tomato, green tomato,
            canned tomatoes, diced tomatoes, crushed tomatoes, whole tomatoes, stewed tomatoes, whole peeled tomatoes,
            fire-roasted tomatoes, san marzano tomatoes, can tomato, tomatoes in juice, tomatoes juice,
            tomatoes green chile pepper]
  broad: [tomato paste, tomato sauce, tomato puree, sun-dried tomato, passata]
egg:
  members: [egg white, egg yolk, hard-boiled egg, hard-cooked egg, hard boiled egg]
  broad: []
rice:
  members: [white rice, brown rice, jasmine rice, basmati rice, long-grain rice, long grain rice, arborio rice,
            short-grain rice, sushi rice, instant rice, wild rice]
  broad: []
  exclude: [cauliflower rice]  # rice vinegar / rice flour / rice noodles end in another head noun already
cream:
  members: [heavy cream, whipping cream, heavy whipping cream, light cream, light whipping cream, half and half,
            half-and-half cream, double cream, single cream, table cream]
  broad: []
  exclude: [sour cream, ice cream, coconut cream, whipped cream, marshmallow cream, pastry cream, irish cream]
pasta:
  members: [penne, penne rigate, spaghetti, spaghettini, linguine, linguini, fettuccine, fettuccini, rigatoni, ziti,
            rotini, fusilli, farfalle, orzo, macaroni, elbow macaroni, angel hair, capellini, vermicelli, bucatini,
            pappardelle, tagliatelle, orecchiette, ditalini, cavatappi, gemelli, campanelle, lasagna noodle,
            pasta shell, egg fettuccine]
  broad: [egg noodles, tortellini, ravioli, gnocchi]
  exclude: [rice vermicelli]
bell pepper:
  members: [red bell pepper, green bell pepper, yellow bell pepper, orange bell pepper, roasted red pepper]
  broad: []
chili pepper:
  members: [jalapeno, serrano pepper, habanero pepper, poblano pepper, anaheim chile, thai chile,
            green chiles, chipotle in adobo, scotch bonnet pepper, fresno chile, ancho chile]
  broad: [red pepper flakes, chili powder, cayenne pepper]
potato:
  members: [yukon gold potato, red potato, new potato, fingerling potato, baking potato, white potato]
  broad: [sweet potato]
flour:
  members: [bread flour, cake flour, whole wheat flour, pastry flour, self-rising flour, white whole wheat flour]
  broad: [rice flour, almond flour, cornstarch, cornmeal]
sugar:
  members: [brown sugar, powdered sugar, turbinado sugar, raw sugar, coconut sugar, demerara sugar,
            sanding sugar, coarse sugar, palm sugar]
  broad: [honey, maple syrup, corn syrup, molasses, agave nectar,  # 'no sugar' also drops sugar-made sweets:
         marshmallow, miniature marshmallow, mini marshmallow, regular marshmallow, marshmallow creme,
         marshmallow cream, marshmallow fluff, candy, caramel, caramel sauce, caramel topping,
         caramel ice cream topping, individually wrapped caramel]
milk:
  members: [evaporated milk, sweetened condensed milk, condensed milk, nonfat dry milk, powdered milk]
  broad: [buttermilk, half and half, heavy cream, coconut milk, almond milk, soy milk]
cheese:
  members: [cheddar cheese, parmesan cheese, mozzarella cheese, feta cheese, ricotta cheese, goat cheese,
            gruyere cheese, monterey jack cheese, swiss cheese, blue cheese, pecorino romano cheese,
            romano cheese, mascarpone cheese, provolone cheese, cottage cheese, fontina cheese, asiago cheese,
            gouda cheese, pepper jack cheese, colby cheese, queso fresco, brie]
  broad: [cream cheese]
  exclude: [macaroni and cheese, mac and cheese]
oil:
  members: [olive oil, vegetable oil, canola oil, peanut oil, sesame oil, coconut oil, grapeseed oil,
            sunflower oil, safflower oil, corn oil, avocado oil, walnut oil, truffle oil]
  broad: [cooking spray, shortening]
  exclude: [in oil]  # 'sun-dried tomatoes in oil', 'tuna in oil' are not oils
vinegar:
  members: [apple cider vinegar, white vinegar, red wine vinegar, white wine vinegar, balsamic vinegar,
            rice vinegar, sherry vinegar, champagne vinegar, malt vinegar]
  broad: []
chicken:
  members: [chicken breast, chicken thigh, chicken wing, chicken drumstick, chicken leg, whole chicken,
            rotisserie chicken, chicken tender, chicken tenderloin, cooked chicken]
  broad: [chicken broth, chicken bouillon, ground chicken]
beef:
  members: [ground beef, beef chuck, chuck roast, flank steak, skirt steak, sirloin steak, beef tenderloin,
            ribeye steak, beef brisket, stew beef, beef stew meat, short rib, steak]
  broad: [beef broth, beef bouillon]
  exclude: [tuna steak, salmon steak, swordfish steak, halibut steak, fish steak, ham steak, cauliflower steak]
pork:
  members: [pork tenderloin, pork chop, pork loin, pork shoulder, ground pork, pork butt, pork belly,
            spare rib, baby back ribs]
  broad: [bacon, ham, pancetta, prosciutto, sausage, italian sausage]
mushrooms:
  members: [cremini mushrooms, shiitake mushrooms, portobello mushrooms, oyster mushroom, porcini mushroom,
            chanterelle mushroom, wild mushroom, button mushroom]
  broad: []
beans:
  members: [black beans, kidney beans, pinto beans, cannellini beans, white beans, chickpea, lima bean,
            navy bean, refried beans, baked beans]
  broad: [green beans, lentils]
  exclude: [vanilla bean, coffee bean, espresso bean, jelly bean, cocoa bean]
lettuce:
  members: [romaine lettuce, iceberg lettuce, butter lettuce, bibb lettuce, boston lettuce, red leaf lettuce,
            green leaf lettuce, mixed greens]
  broad: [arugula, spinach]
lemon:
  members: []
  broad: [lemon juice, lemon zest]
lime:
  members: []
  broad: [lime juice, lime zest]
orange:
  members: [navel orange, blood orange, mandarin orange]
  broad: [orange juice, orange zest]
apple:
  members: [granny smith apple, green apple, red apple, tart apple, honeycrisp apple, gala apple, fuji apple]
  broad: [applesauce, apple juice, apple cider]
