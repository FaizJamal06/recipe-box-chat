# What an ingredient does in a dish (PRD 6.4 step 2): (ingredient, dish context) -> roles. Read at runtime.
# Contexts (evidence.contexts): baked, pasta, dessert_cold, savory; "*" = any context. Keys are vocab canonicals or
# families; a canonical is looked up before its family (egg white before egg). An unknown pair falls back to the
# LLM, labelled "model reasoning, not dataset evidence".
roles:
  egg:
    baked: [binding, leavening, moisture, structure]
    dessert_cold: [setting, richness]
    pasta: [binding, richness]
    savory: [binding]
  egg white:
    baked: [foam, leavening, structure]
    dessert_cold: [foam, setting]
    "*": [binding]
  egg yolk:
    "*": [richness, emulsifying, setting]
  cream:
    pasta: [richness, body]
    savory: [richness, body]
    dessert_cold: [richness, body]
    baked: [moisture, richness]
  butter:
    baked: [fat, tenderness, flavor]
    "*": [fat, flavor]
  milk:
    baked: [liquid, moisture]
    "*": [liquid]
  sour cream:
    "*": [moisture, tang, richness]
  yogurt:
    "*": [moisture, tang]
  cheese:
    pasta: [flavor, saltiness, body]
    "*": [flavor, body]
  parmesan cheese:
    "*": [flavor, saltiness]
  honey:
    "*": [sweetness, moisture]
  sugar:
    baked: [sweetness, moisture, browning]
    "*": [sweetness]
  oil:
    baked: [fat, moisture]
    "*": [fat]
  flour:
    baked: [structure]
    "*": [thickening]
  peanut butter:
    "*": [flavor, fat, body]
  salt:
    "*": [seasoning]
  black pepper:
    "*": [seasoning]

# A dish word in the title -> the ingredients that define that dish. Removing one makes it a different dish, so the
# bot warns and asks before adapting. (An ingredient named in the title, chicken in "Chicken Curry", also counts.)
defining:
  meringue: [egg white, egg]
  angel food: [egg white, egg]
  pavlova: [egg white, egg]
  macaron: [egg white]
  souffle: [egg]
  custard: [egg, egg yolk]
  mayonnaise: [egg, egg yolk]
  carbonara: [egg, egg yolk]
  alfredo: [cream, butter]
  cheesecake: [cream cheese]
  hollandaise: [egg yolk, butter]

# Items a recipe can usually do without (omit.py): the substitution also offers "omit it", graded by how many same-dish
# recipes don't use it. A recipe line that says 'optional', 'for garnish', 'to taste', ... counts too.
optional: [salt, black pepper, pepper, white pepper, parsley, cilantro, chive, basil, mint, dill, green onion, scallion,
           walnut, pecan, almond, hazelnut, pistachio, cashew, nut, sesame seed, coconut, powdered sugar, sprinkles,
           red pepper flake, paprika, lemon zest]
