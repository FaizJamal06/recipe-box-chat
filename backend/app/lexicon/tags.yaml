           vegetable broth, vegetable stock, mushroom broth, chickpea, goat cheese, goat milk,
           goats milk, goat yogurt, poultry seasoning, quail egg, duck egg, vegetable bouillon, mushroom stock,
           fish stock, fish broth, seafood stock, shrimp stock, lobster stock, clam broth, clam juice]
  contains: [meat, beef, steak, sirloin, brisket, chuck, flank, skirt steak, veal, lamb, mutton, goat,
