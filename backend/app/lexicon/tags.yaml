             cracker, graham, cookie, cake, pie crust, pastry, phyllo, filo, biscuit, pretzel, beer, ale,
             lager, stout, malt, soy sauce, teriyaki, cake mix, brownie mix, matzo, matzoh, wonton, wrapper,
