# "What it contains" tags for hard constraints (PRD 4.5). Matched as whole words against the ingredient
# name (an optional plural s/es is allowed). Per tag, in this order:
#   free_if:     any of these words present -> tag does NOT apply ("vegan cheese", "dairy-free milk").
#   except:      phrases masked out before matching ("coconut milk" hides "milk").
#   contains:    -> level "contains" (hard filters exclude it).
#   may_contain: -> level "may_contain" (shown with a "check label" badge; strict mode excludes it).
# "meat" = any land-animal flesh incl. poultry; pork and poultry are also tagged separately.
# vegetarian = no meat, fish, shellfish.

# not_food: equipment and serving notes. normalize masks them out of the line (hyphen-aware, so "pan-fried"
# stays) before parsing and tagging: "cookie cutter" is not gluten, "1 9-inch skillet" names nothing.
# A line labelled "Special equipment:" is dropped entirely.
not_food: [cookie cutter, custard cup, muffin cup, muffin tin, muffin pan, cupcake liner, paper liner, pastry bag,
           pastry brush, cake pan, pie plate, pie dish, baking sheet, baking dish, baking pan, sheet pan,
           jelly roll pan, roasting pan, pan, skillet, sheet, skewer, toothpick, parchment, parchment paper,
           wax paper, waxed paper, paper towel, cheesecloth, kitchen twine, butcher twine, kitchen string, twine,
           foil, plastic wrap, thermometer, ramekin, springform pan, loaf pan, tart pan, piping bag,
           candy thermometer, ice cream maker, wire rack, cooling rack, for serving, to serve]

