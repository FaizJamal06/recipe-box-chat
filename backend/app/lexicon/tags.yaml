# "What it contains" tags for hard constraints (PRD 4.5). Matched as whole words against the ingredient
# name (an optional plural s/es is allowed). Per tag, in this order:
#   free_if:     any of these words present -> tag does NOT apply ("vegan cheese", "dairy-free milk").
#   except:      phrases masked out before matching ("coconut milk" hides "milk").
#   contains:    -> level "contains" (hard filters exclude it).
#   may_contain: -> level "may_contain" (shown with a "check label" badge; strict mode excludes it).
# "meat" = any land-animal flesh incl. poultry; pork and poultry are also tagged separately.
# vegetarian = no meat, fish, shellfish.

# not_food: equipment and serving notes. normalize masks them out of the line (hyphen-aware, so "pan-fried"
# stays) before parsing and tagging: "cookie cutter" is not gluten, "1 9-inch skillet" names nothing.
# A line labelled "Special equipment:" is dropped entirely.
not_food: [cookie cutter, custard cup, muffin cup, muffin tin, muffin pan, cupcake liner, paper liner, pastry bag,
           pastry brush, cake pan, pie plate, pie dish, baking sheet, baking dish, baking pan, sheet pan,
           jelly roll pan, roasting pan, pan, skillet, sheet, skewer, toothpick, parchment, parchment paper,
           wax paper, waxed paper, paper towel, cheesecloth, kitchen twine, butcher twine, kitchen string, twine,
           foil, plastic wrap, thermometer, ramekin, springform pan, loaf pan, tart pan, piping bag,
           candy thermometer, ice cream maker, wire rack, cooling rack, for serving, to serve]

dairy:
  free_if: [dairy-free, dairy free, non-dairy, nondairy, vegan, plant-based, lactose-free milk substitute]
  except: [coconut milk, coconut cream, cream of coconut, almond milk, soy milk, soymilk, oat milk, rice milk,
           cashew milk, hemp milk, peanut butter, almond butter, cashew butter, sunflower butter, nut butter,
           apple butter, pumpkin butter, cocoa butter, shea butter, butter bean, butter lettuce, butterhead,
           cream of tartar, coconut milk powder, coconut yogurt, cream soda, milk thistle, bread flour,
           pastry flour, butter flavored, butter-flavored, butter flavor, cream-style, cream style]
  contains: [milk, cream, butter, cheese, yogurt, yoghurt, ghee, whey, casein, buttermilk, sour cream,
             half and half, half-and-half, creme fraiche, kefir, quark, mascarpone, ricotta, parmesan,
             parmigiano-reggiano, parmigiano, mozzarella, cheddar, feta, gruyere, brie, camembert, pecorino,
             romano, asiago, provolone, gouda, fontina, gorgonzola, emmental, emmentaler, havarti, manchego,
             burrata, halloumi, cotija, colby, monterey jack, queso, paneer, neufchatel, roquefort, stilton,
             gelato, custard, eggnog, alfredo, bechamel, tzatziki, ranch dressing, lassi, dulce de leche,
             condensed milk, evaporated milk, powdered milk, nonfat dry milk, lactose]
  may_contain: [margarine, chocolate, bread, cake mix, brownie mix, biscuit mix, pancake mix, bisquick,
                cookie, cracker, pastry, pie crust, croissant, brioche, caramel, toffee, butterscotch,
                coffee creamer, creamer, whipped topping, cool whip, pesto, ranch, cream of mushroom soup,
                mashed potato flake, nougat, frosting, icing, pudding mix]

egg:
  free_if: [egg-free, eggless, vegan, egg replacer]
  except: [eggplant, rice noodle, bread flour, pastry flour]
  contains: [egg, egg white, egg yolk, yolk, mayonnaise, mayo, egg noodle, meringue, aioli, eggnog,
             hollandaise, egg substitute, egg beater, custard, challah, brioche]
  may_contain: [fresh pasta, cake mix, brownie mix, pancake mix, biscuit mix, cookie, bread, tartar sauce,
                caesar dressing, ladyfinger, puff pastry, pastry, wonton wrapper, egg roll wrapper, marshmallow]

peanut:
  free_if: [peanut-free]
  except: []
  contains: [peanut, peanut butter, peanut oil, groundnut, goober]
  may_contain: [satay sauce, mixed nuts, nut butter, chocolate candy, granola, trail mix]

tree_nut:
